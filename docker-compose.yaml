name: deployment

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    ports: 
      - ${DB_PORT}:5432
    volumes: 
      - eagle-pg-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER: ${DB_USER}
      - POSTGRES_PASSWORD: ${DB_PASS}
      - POSTGRES_DB: ${DB_NAME}
    networks: 
      - eagle-network
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USER} -d ${DB_NAME}' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  eagle-eye-backend:
    env_file:
      - .env
    image: ${IMAGE_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eagle-eye-backend
    ports: 
      - ${PORT}:8080
    volumes:
      - ./storage/logs:/app/storage/logs
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - eagle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    environment:
      - TZ=Asia/Jakarta
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 90 eagle-eye-backend
    restart: unless-stopped
    networks:
      - eagle-network
  migrate:
    image: migrate/migrate:4
    volumes:
      - ./database/migration:/migration
    networks:
      - eagle-network

volumes:
  eagle-pg-data:

networks:
  eagle-network:
    driver: bridge
    